- aid: canada-health-infoway:infoway-terminology-service-api
  name: Infoway Terminology Service API
  description: >-
    RESTful (non-FHIR) terminology API from Canada Health Infoway for browsing and downloading
    Canadian terminology content - code systems, subsets (value sets), maps, resource locations,
    and packages - with delta/versioning, session login (basic credentials, SSO token, or JWT),
    and webhook-style notification subscriptions.
