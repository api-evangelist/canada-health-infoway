- aid: canada-health-infoway:infoway-fhir-terminology-service-api
  name: Infoway FHIR Terminology Service API
  description: >-
    HL7 FHIR R4 (4.0.1) terminology service from Canada Health Infoway's Terminology Gateway
    (HAPI FHIR), exposing CodeSystem, ValueSet, ConceptMap, and OperationDefinition resources
    with read/vread/history/search plus the $lookup, $expand, $translate, and $validate-code
    terminology operations. A live FHIR CapabilityStatement is served at the base URL's
    /metadata endpoint.
