name: Canada Health Infoway
kind: company
description: >-
  Canada Health Infoway is an independent, federally funded not-for-profit organization
  that leads the adoption of digital health and pan-Canadian interoperability across
  Canada's province- and territory-fragmented healthcare system. Infoway stewards the
  pan-Canadian FHIR interoperability specifications - CA Core+ and the CA Baseline profiles
  developed with the Canadian Institute for Health Information (CIHI) - and operates the
  Canadian FHIR Registry, the Canadian URI Registry, and a national Terminology Gateway.
  Its developer-facing API surface, published through the Accelero developer portal, is
  a HAPI-FHIR R4 (4.0.1) Terminology Service exposing CodeSystem, ValueSet, and ConceptMap
  resources with $lookup, $expand, $translate, and $validate-code operations, alongside a
  companion RESTful Terminology API for browsing code systems, subsets, maps, and packages.
  Infoway is a standards steward and terminology infrastructure operator for the Canadian
  market rather than a commercial clinical-data platform; the terminology content APIs are
  gated behind free registration and a session/token login, while the FHIR CapabilityStatement
  is served anonymously.
